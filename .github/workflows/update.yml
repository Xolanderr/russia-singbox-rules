name: Update sing-box rules

on:
  schedule:
    - cron: "30 4,10,16,22 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Get latest upstream release
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(gh release view \
            --repo runetfreedom/russia-v2ray-rules-dat \
            --json tagName \
            --jq '.tagName')

          echo "Latest upstream release: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Check if release already exists
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.upstream.outputs.tag }}"

          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "Release $TAG does not exist."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download sing-box.zip
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p download

          gh release download "${{ steps.upstream.outputs.tag }}" \
            --repo runetfreedom/russia-v2ray-rules-dat \
            --pattern "sing-box.zip" \
            --dir download

      - name: Extract rules
        if: steps.check.outputs.exists == 'false'
        run: |
          mkdir -p extracted

          unzip -q download/sing-box.zip -d extracted

      - name: Normalize filenames
        if: steps.check.outputs.exists == 'false'
        run: |
          find extracted -type f -print0 |
          while IFS= read -r -d '' file; do
            dir="$(dirname "$file")"
            name="$(basename "$file")"

            safe_name="$(printf '%s' "$name" | sed 's/[^a-zA-Z0-9._-]/-/g')"

            if [ "$name" != "$safe_name" ]; then
              echo "Renaming:"
              echo "  $name"
              echo "  -> $safe_name"

              mv "$file" "$dir/$safe_name"
            fi
          done

      - name: Show extracted files
        if: steps.check.outputs.exists == 'false'
        run: |
          echo "Files to upload:"
          find extracted -type f -print | sort

      - name: Create release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.upstream.outputs.tag }}"

          mapfile -d '' files < <(
            find extracted -type f -print0
          )

          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "$TAG" \
            --notes "Mirrored from runetfreedom/russia-v2ray-rules-dat release $TAG." \
            --verify-tag \
            "${files[@]}"